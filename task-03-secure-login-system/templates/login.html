{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<section class="card"><h2>Sign in</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Username<input name="username" autocomplete="username" maxlength="32" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Login securely</button></form><p>New user? <a href="{{url_for('register')}}">Create an account</a></p></section>{% endblock %}
